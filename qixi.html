<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>七夕快乐</title>
<link rel="stylesheet" href="css/qixi.css" />
<script src="js/jquery.js"></script>
<script src="js/garden.js"></script>
</head>
<body>
<div id="qixi">
    <!-- 白云 -->
    <div class="clouds">
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>
    </div>

    <div class="title">
        <h1>七夕快乐</h1>
        <p>❀ 致我最爱的 One Two Bao ❀</p>
    </div>

    <!-- 一二布布 IP 形象（CSS 手绘两只小熊） -->
    <div class="bears">
        <div class="bear bear-brown">
            <div class="ear l"></div><div class="ear r"></div>
            <div class="face">
                <div class="eye l"></div><div class="eye r"></div>
                <div class="muzzle"><div class="nose"></div></div>
            </div>
        </div>
        <div class="bear bear-white">
            <div class="ear l"></div><div class="ear r"></div>
            <div class="face">
                <div class="eye l"></div><div class="eye r"></div>
                <div class="muzzle"><div class="nose"></div></div>
            </div>
        </div>
    </div>

    <canvas id="garden"></canvas>

    <!-- 绿色草地 -->
    <div class="grass"></div>

    <div class="bottom">
        <div class="timer" id="elapseClock"></div>
        <div class="wish">
            <span class="code-line">// 一、No No Ge 遇见了 One Two Bao</span><br/>
            <span class="code-line">// 二、No No Ge 爱上了 One Two Bao</span><br/>
            One Two Bao，七夕快乐 ✿ 银河再宽，<br/>
            也隔不断 No No Ge 想你的每一秒。<br/>
            今夕何夕，与 One Two Bao 共此良辰。
            <span class="sign">— 爱你的 No No Ge ♡</span>
        </div>
    </div>
</div>

<script>
(function () {
    // 纪念日（与首页一致：2013-10-10 08:49:02）
    var together = new Date(2013, 10 - 1, 10, 8, 49, 2, 0);

    var $garden = $("#garden");
    var canvas = $garden[0];
    var ctx = canvas.getContext("2d");
    ctx.globalCompositeOperation = "lighter";

    // 根据屏幕宽度自适应画布与心形缩放
    function resize() {
        var w = $garden.width();
        var h = $garden.height();
        canvas.width = w;
        canvas.height = h;
        ctx.globalCompositeOperation = "lighter";
    }
    resize();

    var offsetX = canvas.width / 2;
    var offsetY = canvas.height / 2;
    var scale = Math.min(canvas.width, canvas.height) / 320; // 心形缩放系数

    var garden = new Garden(ctx, canvas);

    function getHeartPoint(angle) {
        var t = angle / Math.PI;
        var x = 19.5 * (16 * Math.pow(Math.sin(t), 3)) * scale;
        var y = -20 * (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * scale;
        return [offsetX + x, offsetY + y];
    }

    function startHeartAnimation() {
        var angle = 10;
        var heart = [];
        var timer = setInterval(function () {
            var bloom = getHeartPoint(angle);
            var draw = true;
            for (var i = 0; i < heart.length; i++) {
                var p = heart[i];
                var d = Math.sqrt(Math.pow(p[0] - bloom[0], 2) + Math.pow(p[1] - bloom[1], 2));
                if (d < Garden.options.bloomRadius.max * 1.3) { draw = false; break; }
            }
            if (draw) {
                heart.push(bloom);
                garden.createRandomBloom(bloom[0], bloom[1]);
            }
            if (angle >= 30) { clearInterval(timer); }
            else { angle += 0.2; }
        }, 40);
    }

    // 渲染循环：每帧清屏后完整重绘（修复心形消失）
    setInterval(function () {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        garden.render();
    }, Garden.options.growSpeed);

    setTimeout(startHeartAnimation, 600);

    // 恋爱计时
    function pad(n) { return n < 10 ? "0" + n : "" + n; }
    function timeElapse(date) {
        var now = new Date();
        var s = Math.floor((now.getTime() - date.getTime()) / 1000);
        var days = Math.floor(s / 86400); s %= 86400;
        var hours = Math.floor(s / 3600); s %= 3600;
        var minutes = Math.floor(s / 60);
        var seconds = s % 60;
        $("#elapseClock").html(
            "我们相恋已 <span class='digit'>" + days + "</span> 天 " +
            "<span class='digit'>" + pad(hours) + "</span>:<span class='digit'>" + pad(minutes) + "</span>:<span class='digit'>" + pad(seconds) + "</span>"
        );
    }
    timeElapse(together);
    setInterval(function () { timeElapse(together); }, 1000);

    // 飘落花瓣装饰
    var $qixi = $("#qixi");
    for (var i = 0; i < 14; i++) {
        var petal = document.createElement("div");
        petal.className = "petal-fall";
        petal.style.left = Math.random() * 100 + "vw";
        petal.style.animationDuration = (6 + Math.random() * 6) + "s";
        petal.style.animationDelay = (Math.random() * 8) + "s";
        var sz = 6 + Math.random() * 10;
        petal.style.width = sz + "px";
        petal.style.height = sz + "px";
        $qixi.append(petal);
    }

    // 窗口尺寸变化时重算（避免整页刷新造成的闪烁）
    var rt;
    window.addEventListener("resize", function () {
        clearTimeout(rt);
        rt = setTimeout(function () {
            resize();
            offsetX = canvas.width / 2;
            offsetY = canvas.height / 2;
            scale = Math.min(canvas.width, canvas.height) / 320;
        }, 200);
    });
})();
</script>
</body>
</html>
